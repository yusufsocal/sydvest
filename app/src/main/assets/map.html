<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; }
        #map { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://cdn.jsdelivr.net/npm/ol@10.5.0/ol.css';
    document.head.appendChild(link);

    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/ol@10.5.0/dist/ol.js';
    script.onload = function() {
        setTimeout(function() {
            var el = document.getElementById('map');
            el.style.width = window.innerWidth + 'px';
            el.style.height = window.innerHeight + 'px';

            var map = new ol.Map({
                target: 'map',
                layers: [
                    new ol.layer.Tile({
                        source: new ol.source.XYZ({
                            url: 'https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
                            attributions: '&copy; OpenStreetMap contributors &copy; CARTO'
                        })
                    })
                ],
                view: new ol.View({
                    center: ol.proj.fromLonLat([10.75, 59.91]),
                    zoom: 11
                })
            });
        }, 500);
    };
    document.head.appendChild(script);
</script>
</body>
</html>
